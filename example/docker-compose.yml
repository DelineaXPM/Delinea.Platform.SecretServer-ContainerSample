services:
  # Delinea Sidecar: fetches secrets and exposes them via HTTP API
  sidecar:
    build:
      context: ../container
      dockerfile: Dockerfile
    environment:
      # Secrets Configuration (JSON format with field filtering)
      # Replace with your actual secret IDs from Delinea PLatform/Secret-Server
      # Note: You can give custom names to secrets below for easier reference
      # Note: Field filtering is supported using comma-separated slug-field names or '*' for all fields
      # 3 sample secrets provided below
      SECRETS_CONFIG: |
        [
          {
            "id": "11113",
            "name": "database-prod",
            "fields": "username,password,hostname,port"
          },
          {
            "id": "11126",
            "name": "mongo-secret",
            "fields": "database,username,password"
          },
          {
            "id": "10876",
            "name": "folder-secret",
            "fields": "*"
          }
        ]

      # Storage Configuration
      POLL_INTERVAL: "60"
      HTTP_PORT: "8080"
      BIND_HOST: "0.0.0.0"

    # Mount the Docker secret
    # Docker secret for Delinea credentials
    secrets:
      - server_creds

    # Internal-only network
    networks:
      - delinea_secure_network

    # Healthcheck for sidecar API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX HTTPS Proxy: TLS termination for sidecar API
  nginx-proxy:
    image: nginx:alpine
    depends_on:
      - sidecar
    # Mount config and SSL certs
    volumes:
      - ../container/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../container/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - delinea_secure_network
    # Healthcheck for HTTPS proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Consumer App: demo/test client for sidecar secrets
  consumer-app:
    image: alpine/curl
    depends_on:
      - nginx-proxy
    networks:
      - delinea_secure_network
    environment:
      SIDECAR_URL: https://nginx-proxy:8443
    # Trust the NGINX proxy's CA cert
    volumes:
      - ../container/nginx/ssl/server.crt:/usr/local/share/ca-certificates/nginx-proxy.crt:ro
    command: |
      sh -c '
        apk add --no-cache ca-certificates curl
        update-ca-certificates
        echo "🚀 Consumer App Starting..."
        echo "⏳ Waiting for sidecar to be ready..."
        sleep 15

        echo "🔍 Testing sidecar connectivity:"
        curl -f https://nginx-proxy:8443/health || echo "❌ Health check failed"
        echo ""

        echo "📋 Getting secrets list:"
        curl -f https://nginx-proxy:8443/secrets || echo "❌ Secrets list failed"
        echo ""

        echo "🔐 Fetching database-prod secret:"
        curl -f https://nginx-proxy:8443/secrets/database-prod || echo "❌ Database secret failed"
        echo ""

        echo "🍃 Fetching mongo-secret:"
        curl -f https://nginx-proxy:8443/secrets/mongo-secret || echo "❌ Mongo secret failed"
        echo ""

        echo ""

        echo "✅ Initial tests complete. Keeping container alive..."
        tail -f /dev/null
      '

  # MongoDB: persistent database for backend
  mongodb:
    image: mongo:7.0
    container_name: mongodb-persistent
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-company_db}
    # Persist data and run init script
    volumes:
      - mongodb_data:/data/db
      - ./mongodb_init:/docker-entrypoint-initdb.d
    networks:
      - delinea_secure_network
    restart: unless-stopped

  # Employee Backend: Node.js app, gets DB creds from sidecar
  employee-backend:
    build:
      context: ./employee_app_container
      dockerfile: Dockerfile
    container_name: employee-backend
    depends_on:
      - nginx-proxy
      - sidecar
      - mongodb
    networks:
      - delinea_secure_network
    volumes:
      - ../container/nginx/ssl/server.crt:/usr/local/share/ca-certificates/nginx-proxy.crt:ro
    # Wait for NGINX proxy (HTTPS) and MongoDB to be ready before starting
    command: >
      sh -c "
        cd /app &&
        until curl -skf https://nginx-proxy:8443/health; do echo 'waiting for nginx-proxy'; sleep 2; done &&
        until nc -z mongodb 27017; do echo 'waiting for mongodb'; sleep 2; done &&
        echo 'dependencies ready, starting app' &&
        node server.js"
    ports:
      - "3000:3000"
    # App configuration via environment variables
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ${DB_HOST:-mongodb}
      DB_PORT: ${DB_PORT:-27017}
      DB_NAME: ${DB_NAME:-company_db}
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_AUTH_SOURCE: ${DB_AUTH_SOURCE:-admin}
      APP_PORT: ${APP_PORT:-3000}
      APP_NAME: ${APP_NAME:-Employee Management System}
    restart: unless-stopped
    # Healthcheck for backend API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# =================================================================
# Define Docker Secrets
# =================================================================
# Docker secret for sidecar credentials
secrets:
  server_creds:
    file: ../container/server_creds.txt

# Secure internal network for Delinea services communication
networks:
  delinea_secure_network:
    driver: bridge

# Persistent volume for MongoDB data
volumes:
  mongodb_data:
    name: persistent_mongodb_data
