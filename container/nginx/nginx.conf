events {
    worker_connections 1024;
}

http {
    # Basic HTTP configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version
    server_tokens off;

    # Upstream to sidecar
    upstream sidecar_backend {
        server sidecar:8080;
        keepalive 32;
    }

    # HTTPS Server
    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Client certificate verification (optional)
        # ssl_verify_client optional;
        # ssl_client_certificate /etc/nginx/ssl/ca.crt;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Security: Limit request size
        client_max_body_size 1m;

        # Health check endpoint
        location /health {
            proxy_pass http://sidecar_backend/health;

            # Health check specific settings
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            # Add HTTPS indicator
            add_header X-Served-By nginx-proxy;
            add_header X-Protocol HTTPS;
        }

        # Secrets endpoints - require API key
        location /secrets {
            # Basic rate limiting (optional)
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://sidecar_backend/secrets;

            # API key validation happens at sidecar level
            # Additional headers for security
            add_header X-Served-By nginx-proxy;
            add_header X-Protocol HTTPS;

            # Log secret access
            access_log /var/log/nginx/secrets_access.log;
        }

        # All other endpoints
        location / {
            proxy_pass http://sidecar_backend;

            # Security headers
            add_header X-Served-By nginx-proxy;
            add_header X-Protocol HTTPS;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # Optional: HTTP to HTTPS redirect
    server {
        listen 8080;
        server_name localhost;

        # Redirect all HTTP to HTTPS
        return 301 https://$server_name:8443$request_uri;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
}